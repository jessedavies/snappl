<!doctype html>
<!-- The DMG window background, 640 x 400 (from the "Install window" artboard).
     Finder draws the icons and names on top: Snappl.app at (170, 200) and
     Applications at (470, 200), 128 px. Rendered by scripts/release.sh. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;600&display=swap">
<style>
  html, body { margin: 0; width: 640px; height: 400px; overflow: hidden; }
  .ground { position: relative; width: 640px; height: 400px; overflow: hidden; background: #d9d6cf; font-family: Inter, -apple-system, sans-serif; color: #1d232b; -webkit-font-smoothing: antialiased; }
  .art { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); object-fit: cover; object-position: 40% 55%; filter: brightness(1.18) contrast(0.7) saturate(0.6) blur(1.5px); }
  .wash { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.5); }
  .blob { position: absolute; border-radius: 50%; filter: blur(40px); }
  h1 { position: absolute; top: 52px; left: 0; right: 0; margin: 0; text-align: center; font-size: 15px; line-height: 18px; font-weight: 600; letter-spacing: -0.2px; }
  .target { position: absolute; left: 392px; top: 120px; width: 156px; height: 182px; box-sizing: border-box; border-radius: 34px; border: 1.5px dashed rgba(29, 35, 43, 0.28); background: rgba(255, 255, 255, 0.28); }
  .label { position: absolute; left: 16px; bottom: 16px; padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.5); box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.7); display: flex; flex-direction: column; gap: 1px; }
  .label b { font: italic 400 14px/16px "Instrument Serif", Georgia, serif; }
  .label span { font-size: 11px; line-height: 14px; color: #48515c; }
</style></head>
<body><div class="ground">
  <img class="art" src="moonrise.jpg" alt="">
  <div class="wash"></div>
  <span class="blob" style="left:-12%;top:-30%;width:60%;height:90%;background:radial-gradient(closest-side, rgba(150,182,216,0.3), rgba(150,182,216,0))"></span>
  <span class="blob" style="right:-10%;top:20%;width:55%;height:90%;background:radial-gradient(closest-side, rgba(232,180,170,0.25), rgba(232,180,170,0))"></span>
  <h1>Drag Snappl into Applications</h1>
  <svg width="140" height="44" viewBox="0 0 140 44" style="position:absolute;left:250px;top:178px;overflow:visible" aria-hidden="true">
    <defs><filter id="brush" x="-10%" y="-40%" width="120%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs>
    <g filter="url(#brush)" fill="none" stroke="rgba(29,35,43,0.6)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 26 C 40 10, 92 10, 130 22"/><path d="M117 12 L 131 22 L 116 31"/></g>
  </svg>
  <div class="target"></div>
  <div class="label"><b>Moonrise, Beaumaris</b><span>Clarice Beckett</span></div>
</div></body></html>
